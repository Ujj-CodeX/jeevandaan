services:
  web:
    build: .
    container_name: jeevandaan_web
    restart: always
    command: >
      sh -c "python manage.py migrate &&
              python manage.py collectstatic --noinput &&
              gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --preload"
    ports:
      - "8000:8000"
    env_file:
      - .env

      
            