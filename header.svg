<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1a0005"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="drop-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d6d" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C8102E" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg-glow)" rx="16"/>

  <!-- Animated wave 1 -->
  <path fill="rgba(200,16,46,0.06)">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="M0,200 C150,170 300,220 450,190 C600,160 750,210 900,185 L900,280 L0,280 Z;
              M0,190 C150,215 300,175 450,205 C600,235 750,185 900,200 L900,280 L0,280 Z;
              M0,200 C150,170 300,220 450,190 C600,160 750,210 900,185 L900,280 L0,280 Z"/>
  </path>

  <!-- Animated wave 2 -->
  <path fill="rgba(200,16,46,0.09)">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="M0,230 C200,210 400,250 600,225 C750,208 850,235 900,220 L900,280 L0,280 Z;
              M0,220 C200,245 400,215 600,240 C750,258 850,225 900,235 L900,280 L0,280 Z;
              M0,230 C200,210 400,250 600,225 C750,208 850,235 900,220 L900,280 L0,280 Z"/>
  </path>

  <!-- Glow circle behind drop -->
  <circle cx="450" cy="72" r="48" fill="url(#drop-glow)">
    <animate attributeName="r" values="44;54;44" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Blood drop shape -->
  <g filter="url(#glow-filter)" transform="translate(424, 30)">
    <path d="M26 2 C26 2,4 30,4 42 C4 54,14 62,26 62 C38 62,48 54,48 42 C48 30,26 2,26 2Z" fill="#C8102E">
      <animate attributeName="d"
        values="M26 2 C26 2,4 30,4 42 C4 54,14 62,26 62 C38 62,48 54,48 42 C48 30,26 2,26 2Z;
                M26 0 C26 0,2 30,2 43 C2 56,13 64,26 64 C39 64,50 56,50 43 C50 30,26 0,26 0Z;
                M26 2 C26 2,4 30,4 42 C4 54,14 62,26 62 C38 62,48 54,48 42 C48 30,26 2,26 2Z"
        dur="2.8s" repeatCount="indefinite"/>
    </path>
    <!-- Shine on drop -->
    <path d="M18 20 C18 20,14 32,15 38" stroke="rgba(255,255,255,0.28)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Floating particles -->
  <circle cx="80" cy="60" r="2" fill="#C8102E" opacity="0">
    <animate attributeName="cy" values="240;40;240" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="160" cy="80" r="1.5" fill="#C8102E" opacity="0">
    <animate attributeName="cy" values="260;60;260" dur="9s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="9s" begin="1s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="100" r="2" fill="#C8102E" opacity="0">
    <animate attributeName="cy" values="250;50;250" dur="8s" begin="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.45;0" dur="8s" begin="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="70" r="1.5" fill="#C8102E" opacity="0">
    <animate attributeName="cy" values="240;55;240" dur="11s" begin="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.35;0" dur="11s" begin="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="280" cy="90" r="1.5" fill="#ff4d6d" opacity="0">
    <animate attributeName="cy" values="260;70;260" dur="10s" begin="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.3;0" dur="10s" begin="0.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="630" cy="110" r="2" fill="#ff4d6d" opacity="0">
    <animate attributeName="cy" values="255;65;255" dur="8.5s" begin="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.4;0" dur="8.5s" begin="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Main title with fade-in -->
  <text x="450" y="135" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
        font-size="52" font-weight="800" letter-spacing="-1" fill="white" opacity="0">
    JeevanDaan+
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="163" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
        font-size="14" font-weight="400" letter-spacing="4" fill="#C8102E" opacity="0"
        text-decoration="none">
    JEEVAN MEANS LIFE  ·  DAAN MEANS GIFT
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.7s" fill="freeze"/>
  </text>

  <!-- Tagline -->
  <text x="450" y="195" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
        font-size="13" font-weight="300" letter-spacing="0.5" fill="#888" opacity="0">
    A full-stack blood donation ecosystem · Built to save lives
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1s" fill="freeze"/>
  </text>

  <!-- Bottom line decoration -->
  <line x1="350" y1="218" x2="550" y2="218" stroke="rgba(200,16,46,0.4)" stroke-width="0.5" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.2s" fill="freeze"/>
    <animate attributeName="x1" values="450;350;350" dur="1s" begin="1.2s" fill="freeze"/>
    <animate attributeName="x2" values="450;550;550" dur="1s" begin="1.2s" fill="freeze"/>
  </line>

  <!-- Made in India -->
  <text x="450" y="248" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif"
        font-size="11" fill="#444" opacity="0">
    🇮🇳  Made in India
    <animate attributeName="opacity" values="0;1" dur="1s" begin="1.4s" fill="freeze"/>
  </text>
</svg>